name: Deploy Frontend to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.8
        timeout-minutes: 10
        with:
          host: 10.4.88.39
          username: sysadmin
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          command_timeout: 10m
          envs: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
          script: |
            cd ~/JOODPAKPAW-FRONTEND
            ./deploy.sh
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
