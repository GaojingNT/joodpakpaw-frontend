name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Existing code has lint errors; report them without failing CI until they are cleaned up
      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
        run: npm run build
