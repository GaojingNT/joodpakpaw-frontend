version: '3.9'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* vars must be build args — they are inlined into JS at build time
      args:
        NEXT_PUBLIC_BASE_PATH: /capstone25/cp25nk2
        NEXT_PUBLIC_API_BASE_URL: https://bscit.sit.kmutt.ac.th/capstone25/cp25nk2/
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    container_name: joodpakpaw_frontend
    ports:
      - '3000:3000'
    networks:
      - catbnb-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/capstone25/cp25nk2/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  catbnb-network:
    external: true
